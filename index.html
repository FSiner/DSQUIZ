<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSQUIZ</title>
<meta name="description" content="지문을 읽고 풀고 바로 확인하는 실시간 퀴즈">
<meta name="theme-color" content="#0b2a6f">
<meta property="og:title" content="DSQUIZ"><meta property="og:description" content="지문을 읽고 풀고 바로 확인하는 실시간 퀴즈">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b2a6f'/%3E%3Cpath d='M32 14a14 14 0 1 0 8.4 25.2l6.6 6.6 4-4-6.6-6.6A14 14 0 0 0 32 14zm0 6a8 8 0 1 1 0 16 8 8 0 0 1 0-16z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{--bg:#f5f5f2;--sf:#fff;--sf2:#f0f0ec;--ink:#1b1b1a;--mu:#6c6c66;--ln:#e2e2dc;--ac:#1f4fd8;--ac2:#e8eefc;--ok:#17794a;--ok2:#e4f3ea;--no:#c0352d;--no2:#fbe9e7;--wn:#a86a0c;--wn2:#fbf0dc;--hh:60px}
[data-theme=dark]{--bg:#121212;--sf:#1c1c1b;--sf2:#262625;--ink:#ececea;--mu:#9a9a94;--ln:#33332f;--ac:#7b9dff;--ac2:#1d2740;--ok:#59c68b;--ok2:#14281d;--no:#f07b73;--no2:#2f1a18;--wn:#e6b25a;--wn2:#2d2412}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hdr{position:sticky;top:0;z-index:50;height:var(--hh);display:flex;align-items:center;gap:8px;padding:0 20px;background:var(--sf);border-bottom:1px solid var(--ln)}
.brand{font-weight:700;font-size:20px;letter-spacing:-.02em;margin-right:auto;cursor:pointer}
.brand small{font-weight:500;color:var(--mu);margin-left:8px;font-size:14px}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:8px 14px;font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--sf2)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{color:var(--no)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.lg{padding:14px 26px;font-size:20px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{font-size:14px;color:var(--mu);padding:4px 10px;border:1px solid var(--ln);border-radius:99px}
.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:32px;letter-spacing:-.03em;margin:0 0 4px}
h2{font-size:22px;margin:0 0 12px;letter-spacing:-.02em}
.mu{color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px}
/* entry */
.entry{min-height:calc(100vh - var(--hh));display:grid;place-items:center;padding:24px}
.entry .box{width:min(480px,100%)}
.entry h1{font-size:44px;margin-bottom:8px}
.fld{width:100%;padding:16px 18px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf);font-size:22px;outline:none}
.fld:focus{border-color:var(--ac)}
.fld.s{font-size:16px;padding:10px 12px}
textarea.fld{resize:vertical;line-height:1.6}
.sep{display:flex;align-items:center;gap:12px;color:var(--mu);font-size:14px;margin:28px 0}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--ln)}
/* home */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0}
.tab{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:6px 16px;font-size:16px;font-weight:600}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.qc{padding:20px;display:flex;flex-direction:column;gap:10px;position:relative}
.qc.click{cursor:pointer}.qc.click:hover{border-color:var(--ac)}
.qc h3{margin:0;font-size:21px;letter-spacing:-.02em;line-height:1.35}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:5px;background:var(--sf2);color:var(--mu)}
.tag.ac{background:var(--ac2);color:var(--ac)}.tag.ok{background:var(--ok2);color:var(--ok)}.tag.wn{background:var(--wn2);color:var(--wn)}.tag.no{background:var(--no2);color:var(--no)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.empty{padding:56px 20px;text-align:center;border:1.5px dashed var(--ln);border-radius:12px;color:var(--mu)}
/* modal */
#modal{position:fixed;inset:0;z-index:70;display:none;background:rgba(0,0,0,.5);padding:20px;overflow:auto}
#modal.open{display:block}
.mdl{background:var(--sf);border-radius:14px;max-width:560px;margin:5vh auto;padding:26px;border:1px solid var(--ln)}
.mdl.w{max-width:860px}.mdl.xl{max-width:1100px}
.mdl h2{margin-bottom:14px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:16px;z-index:100;display:none}
/* player */
.pl{display:grid;gap:20px;align-items:start}
.pl.two{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
@media(max-width:900px){.pl.two{grid-template-columns:1fr}}
.pass{padding:24px 28px;max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:calc(var(--hh) + 16px);cursor:zoom-in;font-family:"Noto Serif KR",Pretendard,serif;font-size:21px;line-height:2}
.pass h3{margin:0 0 12px;font-size:18px;font-family:Pretendard,sans-serif;color:var(--mu)}
.pass p,.zt p{margin:0 0 .35em;min-height:1em}
.pass u,.zt u{text-underline-offset:5px;text-decoration-thickness:2px}
mark{background:#ffe27a;color:#111;padding:0 2px;border-radius:2px}
.qbox{padding:26px 28px}
.qno{font-weight:800;color:var(--ac);font-size:20px;margin-bottom:6px}
.qt{font-size:27px;line-height:1.55;font-weight:600;letter-spacing:-.02em;cursor:zoom-in;margin-bottom:20px}
.qt p{margin:0 0 .3em}
.ch{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 18px;margin-bottom:10px;border:1.5px solid var(--ln);background:var(--sf);border-radius:10px;font-size:23px;line-height:1.45;overflow:hidden}
.ch:hover{border-color:var(--ac)}
.ch .no{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ln);display:grid;place-items:center;font-weight:700;font-size:19px;background:var(--sf);z-index:1}
.ch .tx{flex:1;z-index:1}
.ch .cnt{z-index:1;font-size:16px;color:var(--mu);font-weight:600;white-space:nowrap}
.ch .fill{position:absolute;left:0;top:0;bottom:0;background:var(--sf2);z-index:0}
.ch.sel{border-color:var(--ac);background:var(--ac2)}.ch.sel .no{background:var(--ac);border-color:var(--ac);color:#fff}
.ch.ok{border-color:var(--ok);background:var(--ok2)}.ch.ok .no{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.bad{border-color:var(--no);background:var(--no2)}.ch.bad .no{background:var(--no);border-color:var(--no);color:#fff}
.ch.dim{opacity:.55}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ox .ch{justify-content:center;font-size:44px;font-weight:700;padding:22px}
.ox .ch .no{display:none}
.box2{padding:14px 18px;border-radius:10px;margin-top:14px;font-size:20px}
.box2.hint{background:var(--wn2);color:var(--ink);border-left:4px solid var(--wn)}
.box2.exp{background:var(--sf2);border-left:4px solid var(--ac)}
.box2.res{border-left:4px solid var(--ok);background:var(--ok2)}.box2.res.bad{border-color:var(--no);background:var(--no2)}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.nv{width:40px;height:40px;border-radius:8px;border:1.5px solid var(--ln);background:var(--sf);font-weight:700;font-size:16px}
.nv.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.nv.dn{background:var(--ac2);color:var(--ac);border-color:var(--ac)}
.nv.ok{background:var(--ok2);color:var(--ok);border-color:var(--ok)}.nv.bad{background:var(--no2);color:var(--no);border-color:var(--no)}
/* results */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}
.stat{padding:16px 18px}.stat b{display:block;font-size:34px;letter-spacing:-.03em;line-height:1.1}.stat span{color:var(--mu);font-size:15px}
.qrow{display:grid;grid-template-columns:42px 1fr 150px 64px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln);cursor:pointer}
.qrow:last-child{border:0}.qrow.cur{background:var(--sf2)}
.qrow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:10px;background:var(--sf2);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}.meter.low i{background:var(--no)}
.pct.low{color:var(--no);font-weight:700}
.dist{display:grid;gap:8px;padding:6px 0}
.drow{display:grid;grid-template-columns:34px 1fr 90px;gap:10px;align-items:center;font-size:18px}
.dbar{height:30px;background:var(--sf2);border-radius:6px;overflow:hidden}.dbar i{display:block;height:100%;background:var(--mu);opacity:.55}.drow.ans .dbar i{background:var(--ok);opacity:1}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.sc{padding:14px 16px;border-left:5px solid var(--ln);text-align:left;cursor:pointer}
.sc b{font-size:20px;display:block}.sc.doing{border-left-color:#d9a300}.sc.done{border-left-color:var(--ok)}.sc.low{border-left-color:var(--no)}
.dots{display:flex;gap:3px;margin-top:8px;flex-wrap:wrap}.dots i{width:12px;height:12px;border-radius:3px;background:var(--ln)}.dots i.o{background:var(--ok)}.dots i.x{background:var(--no)}.dots i.p{background:#d9a300}
/* editor */
.ed{padding:22px 24px;margin-bottom:14px}
.ed label{display:block;font-weight:600;font-size:15px;color:var(--mu);margin:12px 0 5px}
.erow{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.erow input[type=radio]{width:20px;height:20px;accent-color:var(--ok)}
.edtop{position:sticky;top:var(--hh);z-index:20;background:var(--bg);padding:12px 0;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--ln);margin-bottom:16px}
/* board */
#zoomcv,#zoomhl{width:100%;height:100%;display:block;position:absolute;inset:0;z-index:3}
#zoomhl{z-index:2;pointer-events:none;mix-blend-mode:multiply;opacity:.6}
.zwrap{position:relative;background:#fff;color:#111;border-radius:12px;min-height:60vh}
.zt{position:relative;z-index:1;padding:36px 44px;font-size:34px;line-height:1.9;pointer-events:none}
.zt.serif{font-family:"Noto Serif KR",serif}

/* ===== 네이비 · 화이트 아카데믹 ===== */
:root{--bg:#fff;--sf:#fff;--sf2:#f3f5fa;--ink:#101a33;--mu:#5f6985;--ln:#d9dfeb;--ac:#0b2a6f;--ac2:#e6ebf7;--ok:#17794a;--ok2:#e6f3ec;--no:#b3261e;--no2:#fbeae8;--wn:#8a5a00;--wn2:#faf1dc;--navy:#0b2a6f}
[data-theme=dark]{--bg:#0a1228;--sf:#101b3a;--sf2:#16244b;--ink:#eef1fa;--mu:#9aa6c8;--ln:#26376b;--ac:#8fa9f0;--ac2:#1b2c5c;--ok:#59c68b;--ok2:#12301f;--no:#f07b73;--no2:#34191a;--wn:#e6b25a;--wn2:#2d2412;--navy:#2a4aa8}
body{font-weight:400}
h1,h2,.brand,.entry h1,.qc h3,.qno,.stat b{font-family:"Noto Serif KR",Pretendard,serif;font-weight:700;letter-spacing:-.02em}
.hdr{border-bottom:2px solid var(--navy);background:var(--sf)}
.brand{font-size:19px;color:var(--navy)}
[data-theme=dark] .brand{color:var(--ink)}
.brand small{font-family:Pretendard;font-size:13px;font-weight:500;color:var(--mu)}
.btn{border-radius:2px;font-weight:500;border:1px solid var(--navy);background:#fff;color:var(--navy)}
[data-theme=dark] .btn{background:transparent;color:var(--ink);border-color:var(--ln)}
.btn:hover{background:var(--ac2)}
.btn.on,.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:#12378c;filter:none}
.btn.bad{color:var(--no);border-color:var(--ln)}
.chip{border-radius:2px;border-color:var(--ln)}
.card{border-radius:2px;border:1px solid var(--ln)}
.fld{border-radius:2px;border:1px solid var(--ln);border-bottom:2px solid var(--navy)}
.fld:focus{border-color:var(--navy);background:var(--sf2)}
.tab{border-radius:2px;border:1px solid var(--ln);font-weight:500;color:var(--mu)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tag{border-radius:2px;font-weight:600}
.tag.ac{background:var(--ac2);color:var(--navy)}
[data-theme=dark] .tag.ac{color:var(--ac)}
.mdl{border-radius:2px;border:1px solid var(--ln);border-top:4px solid var(--navy)}
#toast{border-radius:2px;background:var(--navy);color:#fff}
.empty{border-radius:2px}
.qc{border-radius:2px;border-top:3px solid var(--navy);padding:22px}
.qc.click:hover{border-color:var(--navy);box-shadow:0 6px 18px rgba(11,42,111,.14)}
.qc h3{font-size:22px}
.sep{color:var(--mu)}
/* 입장 화면 */
.entry{place-items:stretch;padding:0;align-items:stretch}
:root{--hero:#0b2a6f}[data-theme=dark]{--hero:#0d1d4a}
.entry{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.15fr 1fr;background:var(--bg)}
.hero{position:relative;background:var(--hero);color:#fff;display:flex;align-items:center;padding:64px 72px 64px max(40px,6vw);clip-path:polygon(0 0,100% 0,91% 100%,0 100%);overflow:hidden}
.hero:before{content:"";position:absolute;left:0;bottom:0;width:60%;height:55%;background:rgba(255,255,255,.06);clip-path:polygon(0 0,0 100%,100% 100%)}
.hero-in{position:relative;max-width:560px}
.eyebrow{font-size:13px;letter-spacing:.2em;font-weight:600;opacity:.7}
.hero h1{color:#fff;font-size:clamp(46px,6vw,76px);line-height:1.1;margin:14px 0 18px;padding:0;border:0}
.lead{font-size:clamp(18px,1.6vw,23px);line-height:1.6;opacity:.9;margin:0 0 44px;padding-top:20px;border-top:1px solid rgba(255,255,255,.35)}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.feat li{display:flex;gap:16px;align-items:baseline;font-size:18px}
.feat b{font-family:"Noto Serif KR",serif;font-size:15px;opacity:.55;letter-spacing:.05em}
.gate{position:relative;display:flex;flex-direction:column;justify-content:center;padding:40px 6vw 40px 2vw}
.gate-in{width:min(420px,100%);margin:0 auto}
.gate h2{font-size:30px;margin:0 0 8px;color:var(--ink)}
.lbl{display:block;font-size:14px;font-weight:600;color:var(--mu);margin:0 0 6px}
.etheme{position:absolute;top:20px;right:24px}
.gate-ft{position:absolute;left:0;right:0;bottom:20px;text-align:center;font-size:13px;color:var(--mu)}
.entry .sep{margin:24px 0}
@media(max-width:860px){
 .entry{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .hero{padding:44px 28px 84px;clip-path:polygon(0 0,100% 0,100% 90%,0 100%)}
 .hero h1{font-size:46px;margin:10px 0 14px}.lead{margin-bottom:24px;font-size:17px}.feat li{font-size:16px}
 .gate{padding:28px 24px 70px}.gate-in{margin:0 auto}
}
/* 로고 / 헤더 */
.logo{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:10px;background:var(--hero);color:#fff;font-family:"Noto Serif KR",serif;font-size:17px;vertical-align:middle;transform:translateY(-1px)}
.logo{width:auto;min-width:30px;padding:0 6px;font-size:14px;letter-spacing:.5px;font-weight:700}
.brand small:not(:empty){margin-left:12px;padding-left:12px;border-left:1px solid var(--ln)}
/* 홈 배너 */
.banner{position:relative;overflow:hidden;background:var(--hero);color:#fff;padding:36px 40px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.banner:after{content:"";position:absolute;right:0;top:0;width:260px;height:100%;background:rgba(255,255,255,.07);clip-path:polygon(45% 0,100% 0,100% 100%,0 100%);pointer-events:none}
.banner>*{position:relative;z-index:1}
.banner h1{color:#fff;font-size:clamp(28px,3.4vw,38px);margin:6px 0 4px}
.banner p{margin:0;opacity:.85}
.bacts{display:flex;gap:8px;flex-wrap:wrap}
.banner .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.banner .btn:hover{background:rgba(255,255,255,.14)}
.banner .btn.pri{background:#fff;color:var(--hero);border-color:#fff;font-weight:700}
.banner .btn.pri:hover{background:#e9eefb}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ln);border-top:0;background:var(--sf)}
.kpi>div{padding:16px 24px;border-right:1px solid var(--ln)}.kpi>div:last-child{border-right:0}
.kpi b{display:block;font-family:"Noto Serif KR",serif;font-size:28px;line-height:1.2;color:var(--navy)}
[data-theme=dark] .kpi b{color:var(--ink)}
.kpi span{font-size:14px;color:var(--mu)}
@media(max-width:700px){.kpi{grid-template-columns:repeat(2,1fr)}.kpi>div:nth-child(2){border-right:0}.kpi>div:nth-child(-n+2){border-bottom:1px solid var(--ln)}.banner{padding:28px 22px}}
.pbar{height:4px;background:var(--sf2);margin-top:2px}.pbar i{display:block;height:100%;background:var(--navy)}
.go{font-weight:700;color:var(--navy);font-size:15px}[data-theme=dark] .go{color:var(--ac)}
.qc{transition:box-shadow .15s,transform .15s,border-color .15s}
.qc.click:hover{transform:translateY(-2px)}
.empty{border:1px dashed var(--ln);padding:64px 20px}
/* 공통 마감 */
:focus-visible{outline:3px solid #6f93ff;outline-offset:2px}
.fld:focus-visible{outline:none}
::selection{background:#c9d6fb;color:#0b2a6f}
.btn{transition:background .12s,transform .06s}.btn:active{transform:translateY(1px)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* 문제 풀이 */
.qbox{border-radius:2px}
.qno{font-size:22px;color:var(--navy);margin-bottom:8px}
[data-theme=dark] .qno{color:var(--ac)}
.pass{font-family:"Noto Serif KR",serif}
.ch{border-radius:2px;border:1px solid var(--ln);background:#fff;font-weight:500}
[data-theme=dark] .ch{background:var(--sf)}
.ch:hover{border-color:var(--navy);background:var(--sf2)}
.ch .no{border-radius:2px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-family:"Noto Serif KR",serif;font-weight:700}
[data-theme=dark] .ch .no{background:transparent;color:var(--ink)}
.ch .fill{background:var(--ac2)}
.ch.sel{border:2px solid var(--navy);background:var(--ac2)}
.ch.sel .no{background:var(--navy);color:#fff}
.ch.ok{border:2px solid var(--ok);background:var(--ok2)}
.ch.ok .no{background:var(--ok);color:#fff;border-color:var(--ok)}
.ch.bad{border:2px solid var(--no);background:var(--no2)}
.ch.bad .no{background:var(--no);color:#fff;border-color:var(--no)}
.ch.dim{opacity:.4}
.box2{border-radius:2px;border-left:4px solid var(--navy)}

<body>
<header class="hdr" id="hdr"></header>
<main id="main"></main>
<div id="tools"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
'use strict';
/* ====== 설정 ======
 Firebase를 쓰려면 아래에 본인 프로젝트 값을 넣으세요 (databaseURL 필수).
 비워 두면 '로컬 모드'로 동작하며 같은 브라우저 안에서만 동기화됩니다.
 선생님 설정 화면에서 붙여넣어도 되며, 이 경우 QR 주소에 설정이 함께 담겨 학생 기기에도 전달됩니다. */
const FIREBASE_CONFIG = null;
/* 선생님 아이디는 내부적으로 '아이디@dsquiz.app' 형태의 Firebase 계정으로 바뀝니다(실제 메일 아님).
   선생님 여부는 서버 규칙이 teachers 명단(uid)으로 판단합니다. */
const ID_DOMAIN = 'dsquiz.app';
const toEmail = id => String(id || '').trim().toLowerCase() + '@' + ID_DOMAIN;
let _errAt = 0;
function dbErr(e) {
  console.warn('DB 오류', e); if (Date.now() - _errAt < 4000) return; _errAt = Date.now();
  const c = String((e && e.code) || '') + ' ' + String((e && e.message) || '');
  toast(/operation-not-allowed/.test(c) ? '익명 로그인이 꺼져 있습니다. Firebase 콘솔에서 켜 주세요' : /permission/i.test(c) ? '저장·읽기가 거부되었습니다. 같은 이름을 쓰는 다른 학생이 있거나 보안 규칙을 확인해야 합니다' : '연결 오류가 발생했습니다');
}
/* 예: {apiKey:"...", authDomain:"...", databaseURL:"https://xxxx-default-rtdb.firebaseio.com", projectId:"..."} */

const CIRC = '①②③④⑤';
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => o == null ? null : JSON.parse(JSON.stringify(o));
const fmt = t => esc(t).split('\n').map(l => '<p>' + l.replace(/\[\[(.+?)\]\]/g, '<u>$1</u>').replace(/\{\{(.+?)\}\}/g, '<mark>$1</mark>') + '</p>').join('');

/* ====== 안전한 저장소 (localStorage가 막혀도 동작) ====== */
const store = (() => {
  let ok = false; try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); ok = true; } catch (e) {}
  const mem = {};
  return {
    ok,
    get(k, d) { try { const v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { const s = JSON.stringify(v); try { if (ok) localStorage.setItem(k, s); else mem[k] = s; } catch (e) { mem[k] = s; } },
    del(k) { try { if (ok) localStorage.removeItem(k); else delete mem[k]; } catch (e) { delete mem[k]; } }
  };
})();
const sess = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return this._m && this._m[k]; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { (this._m = this._m || {})[k] = v; } },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) { if (this._m) delete this._m[k]; } }
};

/* ====== 실시간 DB 계층 (Firebase / 로컬) ====== */
let DB;
function initDB() {
  let cfg = null;
  const m = location.hash.match(/c=([^&]+)/);
  if (m) { try { cfg = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); store.set('sq_fb', cfg); } catch (e) {} }
  cfg = cfg || store.get('sq_fb', null) || FIREBASE_CONFIG;
  if (cfg && cfg.databaseURL && typeof firebase !== 'undefined') {
    try {
      if (!firebase.apps.length) firebase.initializeApp(cfg);
      const root = firebase.database().ref('smartquiz');
      const auth = firebase.auth(); let done = false, gotInit;
      const authInit = new Promise(res => { gotInit = res; });
      const authReady = new Promise(res => auth.onAuthStateChanged(u => { if (!done) { done = true; gotInit(u); } if (u) res(u); }));
      const anon = () => authInit.then(u => u || auth.signInAnonymously().then(r => r.user));
      DB = { mode: 'firebase', cfg, auth, authInit, authReady, anon,
        uid: () => auth.currentUser ? auth.currentUser.uid : '',
        email: () => auth.currentUser && !auth.currentUser.isAnonymous ? (auth.currentUser.email || '') : '',
        login(id, pw) { return auth.signInWithEmailAndPassword(toEmail(id), pw).then(r => r.user); },
        isTeacher() {
          const u = auth.currentUser; if (!u || u.isAnonymous) return Promise.resolve(false);
          return root.child('teachers/' + u.uid).once('value').then(x => x.val() === true, () => false);
        },
        signOut() { return auth.signOut(); },
        on(p, cb) {
          let off = () => {}, dead = false;
          authReady.then(() => { if (dead) return; const r = root.child(p); const f = r.on('value', s => cb(s.val()), dbErr); off = () => r.off('value', f); });
          return () => { dead = true; off(); };
        },
        set(p, v) {
          return anon().then(u => {
            if (v && typeof v === 'object' && /^(students|responses)\//.test(p)) v = Object.assign({}, v, { uid: u.uid });
            return root.child(p).set(v);
          }).catch(e => { dbErr(e); throw e; });
        },
        remove(p) { return anon().then(() => root.child(p).remove()).catch(e => { dbErr(e); throw e; }); } };
      return;
    } catch (e) { console.warn('Firebase 초기화 실패', e); }
  }
  const KEY = 'sq_db'; let data = store.get(KEY, {}); const ls = [];
  const get = p => { const v = p.split('/').reduce((o, k) => o == null ? undefined : o[k], data); return v === undefined ? null : clone(v); };
  const fire = () => ls.slice().forEach(l => l.cb(get(l.p)));
  DB = { mode: 'local', cfg: null, uid: () => '', email: () => '', isTeacher: () => Promise.resolve(false), anon: () => Promise.resolve(), signOut() {},
    on(p, cb) { const l = { p, cb }; ls.push(l); setTimeout(() => cb(get(p)), 0); return () => { const i = ls.indexOf(l); if (i > -1) ls.splice(i, 1); }; },
    set(p, v) { const ks = p.split('/'); let o = data; ks.slice(0, -1).forEach(k => { if (typeof o[k] !== 'object' || o[k] == null) o[k] = {}; o = o[k]; }); o[ks[ks.length - 1]] = clone(v); store.set(KEY, data); fire(); return Promise.resolve(); },
    remove(p) { const ks = p.split('/'); let o = data; for (const k of ks.slice(0, -1)) { o = o && o[k]; } if (o) delete o[ks[ks.length - 1]]; store.set(KEY, data); fire(); return Promise.resolve(); } };
  window.addEventListener('storage', e => { if (e.key === KEY) { data = store.get(KEY, {}); fire(); } });
}
const subs = {};
function sub(name, path, cb) { unsub(name); subs[name] = DB.on(path, cb); }
function unsub(name) { if (subs[name]) { subs[name](); delete subs[name]; } }

/* ====== 상태 ====== */
const S = {
  role: null, name: '', key: '',
  view: 'entry',
  lib: store.get('sq_lib', []),       // 선생님 퀴즈 보관함
  pub: [],                            // 공개된 퀴즈 (학생이 봄)
  resp: {}, students: {},
  unit: '전체', q: '', sort: 'mine',
  cur: null, ed: null, rv: null       // rv: 결과 화면 {quizId, qi}
};
const saveLib = () => store.set('sq_lib', S.lib);
S.cats = store.get('sq_cats', []);
const saveCats = () => store.set('sq_cats', S.cats);
const addCat = n => { n = String(n || '').trim(); if (!n) return false; if (S.cats.includes(n)) return false; S.cats.push(n); saveCats(); return true; };
const syncCats = () => { S.lib.forEach(q => { if (q.unit && !S.cats.includes(q.unit)) S.cats.push(q.unit); }); saveCats(); };
function catList() {
  if (S.role === 'teacher') return [...S.cats, ...new Set(S.lib.map(q => q.unit).filter(u => u && !S.cats.includes(u)))];
  return [...new Set(S.pub.map(q => q.unit).filter(Boolean))];
}
const getPw = () => store.get('sq_pw', '1234');
const keyOf = n => n.trim().replace(/[.$#\[\]\/\s]+/g, '_').slice(0, 40);

/* ====== 퀴즈 모델 ====== */
const newQ = (type = 'mc') => ({ id: uid(), type, text: '', choices: ['', '', '', '', ''], answer: type === 'short' ? '' : 0, hint: '', explain: '' });
const newQuiz = () => ({ id: uid(), title: '', unit: '', passageTitle: '', passage: '', note: '', questions: [newQ()], published: false, updated: Date.now() });
const normQuiz = q => { q.questions = (q.questions || []).map(x => { x.choices = x.choices || []; while (x.choices.length < 5) x.choices.push(''); return x; }); q.passage = q.passage || ''; q.note = q.note || ''; return q; };
const visChoices = q => q.choices.map((t, i) => ({ t, i })).filter(c => c.t && c.t.trim());
const normS = s => String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase();
function isRight(q, v) {
  if (v === undefined || v === null || v === '') return null;
  if (q.type === 'short') return String(q.answer).split(',').map(normS).filter(Boolean).includes(normS(v));
  return Number(v) === Number(q.answer);
}
function grade(quiz, resp) {
  const per = {}; let ok = 0, ans = 0;
  quiz.questions.forEach(q => { const r = resp && resp.answers ? isRight(q, resp.answers[q.id]) : null; per[q.id] = r; if (r !== null) ans++; if (r) ok++; });
  return { per, ok, ans, total: quiz.questions.length };
}
function answerText(q) {
  if (q.type === 'short') return String(q.answer).split(',')[0].trim();
  if (q.type === 'ox') return Number(q.answer) === 0 ? 'O' : 'X';
  return (Number(q.answer) + 1) + '번  ' + (q.choices[q.answer] || '');
}
function sampleQuiz() {
  const q1 = newQ(); q1.text = '이 시에서 화자의 태도로 가장 적절한 것은?';
  q1.choices = ['이별의 슬픔을 겉으로 드러내지 않고 절제하려 한다.', '떠나는 임에 대한 원망과 분노를 직접 표출한다.', '이별 후 재회를 확신하며 기뻐하고 있다.', '자연 속에서 홀로 살아가는 삶에 만족한다.', '과거의 일을 후회하며 임에게 용서를 구한다.'];
  q1.answer = 0; q1.hint = '마지막 연의 "죽어도 아니 눈물 흘리오리다"에 주목해 보세요.'; q1.explain = '겉으로는 임을 순순히 보내겠다고 하지만, 속으로는 이별의 슬픔을 억누르는 절제된 태도입니다.';
  const q2 = newQ(); q2.text = '[[진달래꽃]]에 담긴 의미로 가장 적절한 것은?';
  q2.choices = ['임의 앞길을 축복하는 화자의 희생적 사랑', '임에 대한 화자의 분노', '화자가 살고 있는 고향의 풍경', '이별을 막으려는 화자의 협박', '계절의 변화에 대한 감탄'];
  q2.answer = 0; q2.explain = '진달래꽃은 임에게 바치는 화자의 사랑과 희생, 그리고 이별의 슬픔을 함께 담은 상징물입니다.';
  const q3 = newQ('ox'); q3.text = '이 시는 슬픔을 드러내지 않는 말투를 통해 오히려 슬픔을 더 크게 느끼게 한다.'; q3.answer = 0; q3.explain = '반어적 표현으로 정서를 강조하는 방식입니다.';
  const q4 = newQ('short'); q4.text = '"죽어도 아니 눈물 흘리오리다"처럼 속마음과 반대로 말하는 표현법은?'; q4.answer = '반어법,반어'; q4.explain = '속마음과 반대로 표현하는 반어법입니다.';
  return { id: uid(), title: '김소월 「진달래꽃」 감상', unit: '', passageTitle: '김소월, 「진달래꽃」',
    passage: '나 보기가 역겨워\n가실 때에는\n말없이 고이 보내 드리오리다.\n\n영변에 약산\n진달래꽃\n아름 따다 가실 길에 뿌리오리다.\n\n가시는 걸음걸음\n놓인 그 꽃을\n사뿐히 즈려밟고 가시옵소서.\n\n나 보기가 역겨워\n가실 때에는\n{{죽어도 아니 눈물 흘리오리다.}}',
    questions: [q1, q2, q3, q4], published: false, updated: Date.now() };
}

/* ====== 공통 UI ====== */
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 2200); }
function openModal(html) { const m = $('#modal'); m.innerHTML = html; m.classList.add('open'); m.scrollTop = 0; }
function closeModal() { const m = $('#modal'); m.classList.remove('open'); m.innerHTML = ''; zoomBoard = null; updateTools(); }
function setTheme(t) { document.documentElement.dataset.theme = t; store.set('sq_theme', t); }
function download(name, text, type) {
  const b = new Blob([text], { type: type || 'text/plain' }); const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => { try { URL.revokeObjectURL(u); } catch (e) {} }, 1000);
}

function visibleQuizzes() {
  const T = S.role === 'teacher';
  let list = (T ? S.lib : S.pub).slice();

  else if (S.unit !== '전체') list = list.filter(q => q.unit === S.unit);
  const kw = S.q.trim().toLowerCase();
  if (kw) list = list.filter(q => (q.title + ' ' + (q.unit || '') + ' ' + q.passageTitle).toLowerCase().includes(kw));
  const ci = u => { const i = catList().indexOf(u); return i < 0 ? 999 : i; };
  if (S.sort === 'recent') list.sort((a, b) => (b.updated || 0) - (a.updated || 0));
  else if (S.sort === 'unit') list.sort((a, b) => ci(a.unit) - ci(b.unit));
  else if (S.sort === 'title') list.sort((a, b) => a.title.localeCompare(b.title, 'ko'));
  else if (!T) list.sort((a, b) => (b.updated || 0) - (a.updated || 0));
  return list;
}

function readImportFile(f) {

}

A.quickOk = () => {

};
function parseQuick(t) {
  const quiz = newQuiz(); quiz.questions = []; let mode = '', q = null; const pass = [];
  const push = () => {
    if (!q) return;
    const raw = q.raw || [], a = (q.ansRaw || '').trim();
    if (raw.length >= 2) {
      q.type = 'mc'; q.choices = raw.slice(0, 5); while (q.choices.length < 5) q.choices.push('');
      let i = CIRC.indexOf(a.charAt(0)); if (i < 0) i = parseInt(a, 10) - 1; q.answer = i >= 0 && i < 5 ? i : 0;
    } else if (/^[OXoxㅇ○×]$/.test(a)) { q.type = 'ox'; q.answer = /^[Oo○ㅇ]$/.test(a) ? 0 : 1; }
    else { q.type = 'short'; q.answer = a; }
    delete q.raw; delete q.ansRaw; quiz.questions.push(q); q = null;
  };
  for (const raw of t.replace(/\r/g, '').split('\n')) {
    const l = raw.trim(); let m;
    if (/^#\s+/.test(l)) { quiz.title = l.replace(/^#\s+/, ''); continue; }
    if ((m = l.match(/^@분류\s*(.+)/))) { quiz.unit = m[1].trim(); continue; }
    if ((m = l.match(/^@지문제목\s*(.*)/))) { quiz.passageTitle = m[1].trim(); continue; }
    if (/^@지문/.test(l)) { mode = 'p'; continue; }
    if (/^@문제/.test(l)) { mode = 'q'; continue; }
    if ((m = l.match(/^Q\d*[\.\)]\s*(.*)/i))) { push(); q = newQ(); q.text = m[1]; q.raw = []; mode = 'q'; continue; }
    if (mode === 'p') { pass.push(raw); continue; }
    if (!q) continue;
    if ((m = l.match(/^정답\s*[:：]\s*(.+)/))) { q.ansRaw = m[1]; continue; }
    if ((m = l.match(/^해설\s*[:：]\s*(.*)/))) { q.explain = m[1]; continue; }
    if ((m = l.match(/^힌트\s*[:：]\s*(.*)/))) { q.hint = m[1]; continue; }
    if ((m = l.match(/^([1-5①②③④⑤])[\)\.]?\s*(.+)/))) { q.raw.push(m[2]); continue; }
    if (l) q.text += '\n' + l;
  }
  push(); quiz.passage = pass.join('\n').trim(); return quiz;
}

function editorQ(q, i) {
  const n = S.ed.questions.length;
  let body = '';
  if (q.type === 'mc') body = '<label>보기 (비워 두면 제외 · 라디오 버튼이 정답)</label>' + q.choices.map((c, k) => `<div class="erow"><input type="radio" name="ans${i}" value="${k}" data-b="answer" data-qi="${i}" ${Number(q.answer) === k ? 'checked' : ''}><input class="fld s" data-b="c" data-qi="${i}" data-ci="${k}" value="${esc(c)}" placeholder="${CIRC[k]} 보기"></div>`).join('');
  else if (q.type === 'ox') body = `<label>정답</label><div style="display:flex;gap:18px;font-size:20px"><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="radio" name="ans${i}" value="0" data-b="answer" data-qi="${i}" ${Number(q.answer) === 0 ? 'checked' : ''}> O</label><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="radio" name="ans${i}" value="1" data-b="answer" data-qi="${i}" ${Number(q.answer) === 1 ? 'checked' : ''}> X</label></div>`;
  else body = `<label>정답 (인정할 답이 여러 개면 쉼표로 구분)</label><input class="fld s" data-b="answer" data-qi="${i}" value="${esc(q.answer)}" placeholder="예: 반어법, 반어">`;
  return `<div class="card ed"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:20px;color:var(--ac)">${i + 1}번</b>
    <select class="fld s" style="width:auto" data-b="type" data-qi="${i}"><option value="mc" ${q.type === 'mc' ? 'selected' : ''}>객관식</option><option value="ox" ${q.type === 'ox' ? 'selected' : ''}>O/X</option><option value="short" ${q.type === 'short' ? 'selected' : ''}>단답형</option></select>
    <span style="flex:1"></span><button class="btn sm" data-act="qMove" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''}>위로</button><button class="btn sm" data-act="qMove" data-i="${i}" data-d="1" ${i === n - 1 ? 'disabled' : ''}>아래로</button><button class="btn sm" data-act="qDup" data-i="${i}">복제</button><button class="btn sm bad" data-act="qDel" data-i="${i}" ${n === 1 ? 'disabled' : ''}>삭제</button></div>
    <label>문제</label><textarea class="fld s" rows="3" data-b="text" data-qi="${i}">${esc(q.text)}</textarea>${body}
    <label>힌트 (선택)</label><input class="fld s" data-b="hint" data-qi="${i}" value="${esc(q.hint)}">
    <label>해설 (선택)</label><textarea class="fld s" rows="2" data-b="explain" data-qi="${i}">${esc(q.explain)}</textarea></div>`;
}
function onEditInput(t) {
  const qi = t.dataset.qi, b = t.dataset.b; let tgt = S.ed;
  if (qi !== undefined) tgt = S.ed.questions[+qi];
  if (t.dataset.ci !== undefined) { tgt.choices[+t.dataset.ci] = t.value; return; }
  if (b === 'type') {
    tgt.type = t.value; tgt.answer = t.value === 'short' ? '' : 0; renderEditor(); return;
  }
  if (t.type === 'radio') { if (t.checked) tgt[b] = Number(t.value); return; }
  tgt[b] = t.value;
}

A.exportOne = () => download((S.ed.title || '퀴즈') + '.json', JSON.stringify({ app: 'class-quiz', quizzes: [S.ed] }, null, 1), 'application/json');
A.edSave = () => {
  const e = S.ed;
  if (!e.title.trim()) return toast('퀴즈 제목을 입력해 주세요');
  for (let i = 0; i < e.questions.length; i++) {
    const q = e.questions[i];
    if (!q.text.trim()) return toast((i + 1) + '번 문제 내용을 입력해 주세요');
    if (q.type === 'mc') {
      if (visChoices(q).length < 2) return toast((i + 1) + '번: 보기를 2개 이상 입력해 주세요');
      if (!(q.choices[q.answer] || '').trim()) return toast((i + 1) + '번: 정답으로 고른 보기가 비어 있습니다');
    }
    if (q.type === 'short' && !String(q.answer).trim()) return toast((i + 1) + '번: 정답을 입력해 주세요');
  }
  e.updated = Date.now();
  const i = S.lib.findIndex(x => x.id === e.id);
  if (i >= 0) S.lib[i] = e; else S.lib.push(e);
  if (e.unit) addCat(e.unit); saveLib(); pushPub(e); toast('저장했습니다'); go('home');
};

/* ====== 플레이어 (수업 모드 / 학생 풀이) ====== */
function openQuiz(quiz, teacher) {
  quiz = normQuiz(clone(quiz));
  const c = { quiz, all: quiz, idx: 0, picks: {}, reveal: {}, hl: {}, hint: {}, submitted: false, view: 'play', sconf: {}, subset: false };
  if (!teacher) {
    const r = myRec(quiz.id);

  if (e.key === 'Enter' && (e.target.id === 'tId' || e.target.id === 'tPw')) { A.idLogin(); return; }
  if (e.key === 'Enter' && e.target.id === 'shortIn') { e.preventDefault(); A.shortOk(); return; }
  if (e.key === 'Escape') { const cf = $('#cfm'); if (cf && cf.classList.contains('open')) { cf.className = ''; cf.innerHTML = ''; return; } if ($('#modal').classList.contains('open')) closeModal(); return; }
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if ((e.ctrlKey||e.metaKey) && (e.key==='z'||e.key==='Z') && activeBoard()) { e.preventDefault(); if (e.shiftKey) A.redo(); else A.undo(); return; }
  if ((e.ctrlKey||e.metaKey) && (e.key==='y'||e.key==='Y') && activeBoard()) { e.preventDefault(); A.redo(); return; }
  if ((e.key==='Delete'||e.key==='Backspace') && activeBoard() && activeBoard().sel) { e.preventDefault(); A.delSel(); return; }
  if (e.key==='Escape' && activeBoard() && activeBoard().sel) { activeBoard().deselect(); return; }
  if (S.view !== 'player' || !S.cur || $('#modal').classList.contains('open')) return;
  if (S.role !== 'teacher' && S.cur.view === 'result') return;
  const q = S.cur.quiz.questions[S.cur.idx];
  if (/^[1-5]$/.test(e.key) && q.type !== 'short') {
    const v = +e.key - 1; if (q.type === 'ox' && v > 1) return; if (q.type === 'mc' && !(q.choices[v] || '').trim()) return;
    A.pick({ v }); return;
  }
  if (e.key === ' ' && S.role === 'teacher') { e.preventDefault(); A.reveal(); }
  else if (e.key === 'ArrowRight') nextQ(1); else if (e.key === 'ArrowLeft') nextQ(-1);
});

/* ====== 시작 ====== */
(function boot() {
  setTheme(store.get('sq_theme', 'light'));
  initDB();
  const role = sess.get('sq_role'), nm = store.get('sq_name', '');
  if (role === 'teacher' && DB.mode === 'firebase') {
    DB.authInit.then(u => {
      const fin = ok => { if (ok) { S.role = 'teacher'; S.name = '선생님'; startTeacher(); S.view = 'home'; } else sess.del('sq_role'); render(); };
      if (u && !u.isAnonymous) DB.isTeacher().then(fin); else fin(false);
    });
  }
  else if (role === 'teacher') { S.role = 'teacher'; S.name = '선생님'; startTeacher(); S.view = 'home'; }
  else if (role === 'student' && nm) { S.role = 'student'; S.name = nm; S.key = keyOf(nm) || ('s' + uid()); startStudent(); S.view = 'home'; }
  render();
})();
</script>
